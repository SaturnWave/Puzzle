<!-- The card of a painting on the world map (MapWorldTR): cream in a gilt rim of 3 points with corners of 14, its dark line of 1.5, a drop and a soft shadow under it. The card is 160 x 160 at (30, 30); the game stretches its middle both ways, so between 54 and 136, along x and along y, nothing may change but the even run of a gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="690" viewBox="0 0 220 230">
<defs><linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C4"/><stop offset=".22" stop-color="#FFDB6E"/><stop offset=".58" stop-color="#F6B93C"/><stop offset="1" stop-color="#D38D1A"/></linearGradient><linearGradient id="in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF4"/><stop offset=".6" stop-color="#FBF0D6"/><stop offset="1" stop-color="#F0DFBB"/></linearGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<rect x="30" y="42" width="160" height="160" rx="14" fill="#042028" fill-opacity=".4" filter="url(#soft)"/><rect x="29" y="35" width="162" height="162" rx="15" fill="#042028" fill-opacity=".35"/><rect x="28.5" y="28.5" width="163" height="163" rx="15.5" fill="#5E3305"/><rect x="30" y="30" width="160" height="160" rx="14" fill="url(#gilt)"/><rect x="33" y="33" width="154" height="154" rx="11" fill="url(#in)"/><rect x="33.6" y="33.6" width="152.8" height="152.8" rx="10.4" fill="none" stroke="#8A5512" stroke-opacity=".55" stroke-width="1.2"/><path d="M44 34.5H176" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
