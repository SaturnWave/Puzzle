<!-- The track of a switch that is on: green in a gilt ring, a white tick at its left end, as the design canvas draws
     it in the settings (SettingsTR). The knob is a picture of its own (toggle-knob.svg) and stands at the right end,
     its middle 15 right of the track's. One unit is one point of the design. The track is 56 x 23 at (8, 6). -->
<svg xmlns="http://www.w3.org/2000/svg" width="576" height="320" viewBox="0 0 72 40">
<defs>
<linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="29"><stop offset="0" stop-color="#A6EE66"/><stop offset=".4" stop-color="#62CC3D"/><stop offset=".66" stop-color="#3FAE35"/><stop offset="1" stop-color="#2E9C2F"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
<clipPath id="in-track"><rect x="8" y="6" width="56" height="23" rx="11.5"/></clipPath>
</defs>
<!-- the drop under the track, the dark line around it, the gilt ring, the track -->
<rect x="4.4" y="5.4" width="63.2" height="30.2" rx="15.1" fill="#5C3810" fill-opacity=".3"/>
<rect x="4.4" y="2.4" width="63.2" height="30.2" rx="15.1" fill="#5E3305"/>
<rect x="5.8" y="3.8" width="60.4" height="27.4" rx="13.7" fill="#F6B93C"/>
<rect x="8" y="6" width="56" height="23" rx="11.5" fill="url(#green)"/>
<!-- the soft shade that falls into the track from its top edge, and the dark green line inside its edge -->
<g clip-path="url(#in-track)">
<path fill="#0A3E14" fill-opacity=".5" fill-rule="evenodd" filter="url(#soft)" d="M-8 -8H80V48H-8Z M19.5 10H52.5A11.5 11.5 0 0 1 64 21.5A11.5 11.5 0 0 1 52.5 33H19.5A11.5 11.5 0 0 1 8 21.5A11.5 11.5 0 0 1 19.5 10Z"/>
<rect x="8.7" y="6.7" width="54.6" height="21.6" rx="10.8" fill="none" stroke="#145A1B" stroke-width="1.4"/>
</g>
<!-- the tick: the canvas' own stroke, written in a box of 12 and shown 17 points across, on its dark green edge -->
<g transform="translate(14 9) scale(1.41667)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M3.4 6.2L5.2 8L8.6 4.2" transform="translate(0 .7)" stroke="#145A1B" stroke-width="3.6"/>
<path d="M3.4 6.2L5.2 8L8.6 4.2" stroke="#fff" stroke-width="2"/>
</g>
</svg>
