<!-- The lit alcove of a card: a piece of the gallery wall in a beaded gilt frame, with a wooden shelf that the card's
     exhibits stand on, as the web test page draws its .alcove (gallery.css and alcove.js). One unit is one point of
     the design. The frame is 302 x 202 at (7, 5), its band 7 wide; the wall and shelf inside it are 288 x 188 at
     (14, 12), and the middle of the shelf's top lies 18 above their foot. The picture is never stretched: a row
     of beads does not stretch. The light is the faint one of a lost game; the game adds the brighter light of a
     won one itself. -->
<svg xmlns="http://www.w3.org/2000/svg" width="948" height="648" viewBox="0 0 316 216">
<defs>
<linearGradient id="gilt" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="207"><stop offset="0" stop-color="#fff4c4"/><stop offset=".22" stop-color="#ffdb6e"/><stop offset=".58" stop-color="#f6b93c"/><stop offset="1" stop-color="#d38d1a"/></linearGradient>
<linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="200"><stop offset="0" stop-color="#1f858c"/><stop offset=".55" stop-color="#17666f"/><stop offset="1" stop-color="#11505a"/></linearGradient>
<radialGradient id="light" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(158 87.2) scale(167 131.6)"><stop offset="0" stop-color="#fff1cc" stop-opacity=".4"/><stop offset=".52" stop-color="#fff1cc" stop-opacity=".12"/><stop offset="1" stop-color="#fff1cc" stop-opacity="0"/></radialGradient>
<linearGradient id="shade-over-shelf" gradientUnits="userSpaceOnUse" x1="0" y1="152" x2="0" y2="170"><stop offset="0" stop-color="#04242b" stop-opacity="0"/><stop offset="1" stop-color="#04242b" stop-opacity=".4"/></linearGradient>
<linearGradient id="shelf" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="200"><stop offset="0" stop-color="#fce8c1"/><stop offset=".0533" stop-color="#fce8c1"/><stop offset=".0533" stop-color="#f3cf96"/><stop offset=".45" stop-color="#d9a566"/><stop offset=".7533" stop-color="#b47b40"/><stop offset=".7533" stop-color="#e1c296"/><stop offset=".8" stop-color="#e1c296"/><stop offset=".8" stop-color="#785022"/><stop offset=".84" stop-color="#785022"/><stop offset=".84" stop-color="#9a6532"/><stop offset="1" stop-color="#9a6532"/></linearGradient>
<linearGradient id="shade-from-top" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="28"><stop offset="0" stop-color="#140a00" stop-opacity=".4"/><stop offset="1" stop-color="#140a00" stop-opacity="0"/></linearGradient>
<linearGradient id="shade-from-left" gradientUnits="userSpaceOnUse" x1="14" y1="0" x2="25" y2="0"><stop offset="0" stop-color="#140a00" stop-opacity=".22"/><stop offset="1" stop-color="#140a00" stop-opacity="0"/></linearGradient>
<pattern id="motif" width="48" height="72" patternUnits="userSpaceOnUse" patternTransform="translate(134 12)">
<path d="M24 0C36 12 48 24 48 36C48 48 36 60 24 72C12 60 0 48 0 36C0 24 12 12 24 0Z" fill="none" stroke="#fff" stroke-opacity=".075" stroke-width="1.4"/>
<path d="M24 22C28.5 28 28.5 33 24 39C19.5 33 19.5 28 24 22Z" fill="#fff" fill-opacity=".07"/>
<path d="M24 40C18 40 14.5 36 15.5 31M24 40C30 40 33.5 36 32.5 31" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="24" cy="46" r="1.8" fill="#fff" fill-opacity=".08"/>
<path d="M0 -5L3.5 0L0 5L-3.5 0Z" fill="#fff" fill-opacity=".06"/><path d="M48 -5L51.5 0L48 5L44.5 0Z" fill="#fff" fill-opacity=".06"/>
<path d="M0 67L3.5 72L0 77L-3.5 72Z" fill="#fff" fill-opacity=".06"/><path d="M48 67L51.5 72L48 77L44.5 72Z" fill="#fff" fill-opacity=".06"/>
</pattern>
<clipPath id="in-niche"><rect x="14" y="12" width="288" height="188" rx="11"/></clipPath>
</defs>
<!-- the frame's drop on the card, the dark line around it, the gilt band -->
<rect x="5.6" y="7.6" width="304.8" height="204.8" rx="19.4" fill="#5c3810" fill-opacity=".28"/>
<rect x="5.6" y="3.6" width="304.8" height="204.8" rx="19.4" fill="#5e3305"/>
<rect x="7" y="5" width="302" height="202" rx="18" fill="url(#gilt)"/>
<!-- the niche: the wall's paint, its damask and light, the shade over the shelf, the shelf with two strokes of grain -->
<g clip-path="url(#in-niche)">
<rect x="14" y="12" width="288" height="188" fill="url(#paint)"/>
<rect x="14" y="12" width="288" height="188" fill="url(#motif)"/>
<rect x="14" y="12" width="288" height="188" fill="url(#light)"/>
<rect x="14" y="152" width="288" height="18" fill="url(#shade-over-shelf)"/>
<rect x="14" y="170" width="288" height="30" fill="url(#shelf)"/>
<path d="M32.1 180.1L188.8 177.9M147.4 187L287.7 189" stroke="#3b200e" stroke-opacity=".28" stroke-width="1.2"/>
<!-- the frame's shade on the niche, from above and from the left, and the dark line along the frame's inner edge -->
<rect x="14" y="12" width="288" height="16" fill="url(#shade-from-top)"/>
<rect x="14" y="12" width="11" height="188" fill="url(#shade-from-left)"/>
<rect x="14.7" y="12.7" width="286.6" height="186.6" rx="10.3" fill="none" stroke="#5e3305" stroke-width="1.4"/>
</g>
<!-- the band's two lines: a light one just inside its outer edge, a brown one just outside its inner edge -->
<rect x="7.9" y="5.9" width="300.2" height="200.2" rx="17.1" fill="none" stroke="#fff6cc" stroke-opacity=".9" stroke-width="1.1"/>
<rect x="13.3" y="11.3" width="289.4" height="189.4" rx="11.7" fill="none" stroke="#9c5c0b" stroke-opacity=".55" stroke-width="1"/>
<!-- the beads along the middle of the band: 204 dots of a dashed line, each over a darker dot as its shade -->
<rect x="10.5" y="8.5" width="295" height="195" rx="14.5" fill="none" stroke="#9c5c0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.01 4.67189" transform="translate(.5 .8)"/>
<rect x="10.5" y="8.5" width="295" height="195" rx="14.5" fill="none" stroke="#fff6cc" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 4.67189"/>
</svg>
