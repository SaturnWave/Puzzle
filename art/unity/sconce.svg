<!-- A wall lamp in the pool of its own light: the web test page's sconce symbol (pieces.svg) with the paints it
     uses. The picture is the 148 x 148 box around the glow; the lamp itself is the 30 x 59 in its lower middle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-36 140 148 148">
<defs>
<linearGradient id="gilt-across" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D38D1A"/><stop offset=".3" stop-color="#FFDB6E"/><stop offset=".5" stop-color="#FFF4C4"/><stop offset=".75" stop-color="#F6B93C"/><stop offset="1" stop-color="#9C5C0B"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".7"/><stop offset=".3" stop-color="#FFE9A8" stop-opacity=".26"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF0"/><stop offset=".6" stop-color="#FFE9A8"/><stop offset="1" stop-color="#F2B63C"/></linearGradient>
