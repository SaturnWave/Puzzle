<!-- The legend of the world map at its top left (MapWorldTR): a cream plate at 92 % with corners of 9, a line of 1.2 and a soft drop. The plate is 48 x 20 at (8, 4); the game stretches its middle sideways, so nothing between x = 20 and x = 44 may change along x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 64 30">
<defs><filter id="soft" x="-30%" y="-50%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
<rect x="8" y="6" width="48" height="20" rx="9" fill="#042028" fill-opacity=".25" filter="url(#soft)"/><rect x="6.8" y="2.8" width="50.4" height="22.4" rx="10.2" fill="#8A5512" fill-opacity=".55"/><rect x="8" y="4" width="48" height="20" rx="9" fill="#FBF2DA" fill-opacity=".92"/>
</svg>
