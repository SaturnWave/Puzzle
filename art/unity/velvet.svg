<!-- The teal velvet behind what a small gilt frame shows, lit from above the middle, as the design canvas draws it
     in the frames of the shop's packs (ShopTR, its paint f-velvet; the gift's picture carries the same velvet). The
     game draws it at the size of a frame's hole, wider than high where the hole is, and frame-small.svg over it.
     The picture is a box of 100 x 100 filled to its corners. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
<defs>
<radialGradient id="f-velvet" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#2FA2A6"/><stop offset=".6" stop-color="#157880"/><stop offset="1" stop-color="#0C505A"/></radialGradient>
</defs>
<rect width="100" height="100" fill="url(#f-velvet)"/>
</svg>
