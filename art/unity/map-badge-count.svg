<!-- The red badge that counts the pieces won on the pin of the painting being restored (MapWorldTR, "7/10"): a pill 13 points high in a dark red line of 1.3, its middle stretched sideways to the count's width, so nothing between x = 14 and x = 18 may change along x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="272" viewBox="0 0 32 17">
<defs><linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA283"/><stop offset=".45" stop-color="#F4472F"/><stop offset="1" stop-color="#C7231B"/></linearGradient></defs>
<rect x="0.7" y="0.7" width="30.6" height="15.6" rx="7.8" fill="#6E1208"/><rect x="2" y="2" width="28" height="13" rx="6.5" fill="url(#r)"/>
</svg>
