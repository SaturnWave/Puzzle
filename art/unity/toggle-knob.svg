<!-- The knob of a switch: a cream ball in a dark line that stands out over its track, as the design canvas draws it
     in the settings (SettingsTR). One unit is one point of the design. The knob is 33 across around (20, 18.5). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 40 40">
<defs>
<!-- the canvas' light "at 36% 26%" of the knob's own box, out to the box's farthest corner -->
<radialGradient id="cream" gradientUnits="userSpaceOnUse" cx="15.38" cy="10.58" r="32.29"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FAEFD5"/><stop offset="1" stop-color="#E2CC9C"/></radialGradient>
<clipPath id="in-face"><circle cx="20" cy="18.5" r="16.5"/></clipPath>
</defs>
<!-- the drop under the knob, the dark line around it, the face -->
<circle cx="20" cy="21.5" r="18.1" fill="#281206" fill-opacity=".38"/>
<circle cx="20" cy="18.5" r="18.1" fill="#5E3305"/>
<circle cx="20" cy="18.5" r="16.5" fill="url(#cream)"/>
<!-- a darker foot (the face less the face moved up), white light along the top (the face less the face moved down) -->
<g clip-path="url(#in-face)">
<path fill="#E0C894" fill-rule="evenodd" d="M0 0H40V40H0Z M3.5 15.5A16.5 16.5 0 0 1 36.5 15.5A16.5 16.5 0 0 1 3.5 15.5Z"/>
<path fill="#fff" fill-rule="evenodd" d="M0 0H40V40H0Z M3.5 20.5A16.5 16.5 0 0 1 36.5 20.5A16.5 16.5 0 0 1 3.5 20.5Z"/>
</g>
</svg>
