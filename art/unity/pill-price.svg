<!-- The dark green pill a price stands in, sunk into the green button that offers five more moves, as the design
     canvas draws it under "+5 hamle" (LoseTR). It is see-through: the button's green shows through it. One unit is
     one point of the design. The pill is 44 x 21 at (10, 5); the game stretches the middle of the picture sideways
     to the width a price needs, so nothing between x = 22 and x = 42 may change along x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 64 32">
<defs>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"/></filter>
<clipPath id="in-pill"><rect x="10" y="5" width="44" height="21" rx="10.5"/></clipPath>
<clipPath id="around-pill"><path clip-rule="evenodd" d="M0 0H64V32H0Z M20.5 5H43.5A10.5 10.5 0 0 1 54 15.5A10.5 10.5 0 0 1 43.5 26H20.5A10.5 10.5 0 0 1 10 15.5A10.5 10.5 0 0 1 20.5 5Z"/></clipPath>
</defs>
<!-- the line of light under the pill's foot (the pill moved down, less the pill), then the pill -->
<rect x="10" y="6" width="44" height="21" rx="10.5" fill="#fff" fill-opacity=".3" clip-path="url(#around-pill)"/>
<rect x="10" y="5" width="44" height="21" rx="10.5" fill="#0A3E14" fill-opacity=".62"/>
<!-- the soft shade that falls in from its top edge -->
<g clip-path="url(#in-pill)">
<path fill="#041E0A" fill-opacity=".5" fill-rule="evenodd" filter="url(#soft)" d="M-8 -8H72V40H-8Z M20.5 6.5H43.5A10.5 10.5 0 0 1 54 17A10.5 10.5 0 0 1 43.5 27.5H20.5A10.5 10.5 0 0 1 10 17A10.5 10.5 0 0 1 20.5 6.5Z"/>
</g>
</svg>
