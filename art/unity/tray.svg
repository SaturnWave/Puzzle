<!-- The wooden tray in which the jigsaw pieces a player has won wait, as the design canvas draws it (JigsawTR): a
     block of warm wood with a well of teal velvet in a gilt rim. One unit is one point of the design. The block is
     144 x 128 at (8, 16); the rim of the well is 12 points in from its sides, 20 from its top and 15 from its foot.
     The game stretches the middle of the picture both ways to the size a tray needs: between x = 48 and x = 112
     nothing changes along x, and between y = 56 and y = 104 only the long upright blends do. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 160 160">
<defs>
<linearGradient id="wood" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="144"><stop offset="0" stop-color="#B5763F"/><stop offset=".38" stop-color="#8E5730"/><stop offset="1" stop-color="#6F4022"/></linearGradient>
<linearGradient id="gilt" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="129"><stop offset="0" stop-color="#FFF4C4"/><stop offset=".22" stop-color="#FFDB6E"/><stop offset=".58" stop-color="#F6B93C"/><stop offset="1" stop-color="#D38D1A"/></linearGradient>
<linearGradient id="velvet" gradientUnits="userSpaceOnUse" x1="0" y1="39" x2="0" y2="126"><stop offset="0" stop-color="#1B858C"/><stop offset=".45" stop-color="#23949A"/><stop offset="1" stop-color="#11636C"/></linearGradient>
<linearGradient id="well-top" gradientUnits="userSpaceOnUse" x1="0" y1="39" x2="0" y2="50"><stop offset="0" stop-color="#031E24" stop-opacity=".62"/><stop offset="1" stop-color="#031E24" stop-opacity="0"/></linearGradient>
<linearGradient id="well-left" gradientUnits="userSpaceOnUse" x1="23" y1="0" x2="33" y2="0"><stop offset="0" stop-color="#031E24" stop-opacity=".34"/><stop offset="1" stop-color="#031E24" stop-opacity="0"/></linearGradient>
<linearGradient id="well-right" gradientUnits="userSpaceOnUse" x1="137" y1="0" x2="129" y2="0"><stop offset="0" stop-color="#031E24" stop-opacity=".2"/><stop offset="1" stop-color="#031E24" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="in-block"><rect x="8" y="16" width="144" height="128" rx="22"/></clipPath>
<clipPath id="in-well"><rect x="23" y="39" width="114" height="87" rx="13"/></clipPath>
</defs>
<!-- the soft shadow on the wall, the dark lip under the block, the dark line around it -->
<rect x="10" y="26" width="140" height="124" rx="22" fill="#031C22" fill-opacity=".4" filter="url(#soft)"/>
<rect x="5.5" y="20" width="149" height="133" rx="24.5" fill="#04242B" fill-opacity=".4"/>
<rect x="5.5" y="13.5" width="149" height="133" rx="24.5" fill="#4B2A0F"/>
<!-- the block: wood, light along its top edge, a dark foot -->
<rect x="8" y="16" width="144" height="128" rx="22" fill="url(#wood)"/>
<g clip-path="url(#in-block)">
<path fill="#FFDEAA" fill-opacity=".6" fill-rule="evenodd" d="M0 0H160V160H0Z M30 18.5H130A22 22 0 0 1 152 40.5V124.5A22 22 0 0 1 130 146.5H30A22 22 0 0 1 8 124.5V40.5A22 22 0 0 1 30 18.5Z"/>
<path fill="#281206" fill-opacity=".5" fill-rule="evenodd" d="M0 0H160V160H0Z M30 11H130A22 22 0 0 1 152 33V117A22 22 0 0 1 130 139H30A22 22 0 0 1 8 117V33A22 22 0 0 1 30 11Z"/>
</g>
<!-- the well: a light line under its rim where the wood catches the light, the dark line, the gilt rim, the velvet -->
<rect x="18.5" y="36.5" width="123" height="96" rx="17.5" fill="#FFDEAA" fill-opacity=".6"/>
<rect x="18.5" y="34.5" width="123" height="96" rx="17.5" fill="#4B2A0F"/>
<rect x="20" y="36" width="120" height="93" rx="16" fill="url(#gilt)"/>
<rect x="23" y="39" width="114" height="87" rx="13" fill="url(#velvet)"/>
<g clip-path="url(#in-well)">
<rect x="23" y="39" width="114" height="11" fill="url(#well-top)"/>
<rect x="23" y="39" width="10" height="87" fill="url(#well-left)"/>
<rect x="129" y="39" width="8" height="87" fill="url(#well-right)"/>
<path fill="#BEF0EC" fill-opacity=".3" fill-rule="evenodd" d="M0 0H160V160H0Z M36 37H124A13 13 0 0 1 137 50V111A13 13 0 0 1 124 124H36A13 13 0 0 1 23 111V50A13 13 0 0 1 36 37Z"/>
<rect x="23.6" y="39.6" width="112.8" height="85.8" rx="12.4" fill="none" stroke="#04242B" stroke-opacity=".7" stroke-width="1.2"/>
<rect x="28" y="44" width="104" height="77" rx="9" fill="none" stroke="#BEF0EC" stroke-opacity=".2" stroke-width="1"/>
</g>
</svg>
