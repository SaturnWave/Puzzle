<!-- The card a result is written on: a large cream plaque in a gilt rim, as the web test page draws its .result-card
     (gallery.css: the plaque's face, edge and drop, and the dark glow that lifts the card off the darkened room).
     One unit is one point of the design. The body is 100 x 100 at (30, 30), the middle of the picture. The game
     stretches the middle of the picture both ways to the size a card needs, so between 54 and 106, along x and
     along y, nothing may change but the even run of a gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 160 160">
<defs>
<linearGradient id="gilt" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="128"><stop offset="0" stop-color="#fff4c4"/><stop offset=".22" stop-color="#ffdb6e"/><stop offset=".58" stop-color="#f6b93c"/><stop offset="1" stop-color="#d38d1a"/></linearGradient>
<linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="125"><stop offset="0" stop-color="#fffdf4"/><stop offset=".55" stop-color="#fbf0d6"/><stop offset="1" stop-color="#f0dfbb"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
<clipPath id="in-face"><rect x="33" y="31" width="94" height="94" rx="15"/></clipPath>
<clipPath id="under-the-top-light"><rect x="33" y="34.5" width="94" height="94" rx="15"/></clipPath>
</defs>
<g transform="translate(0 2)">
<!-- the dark glow around the card, then the hard drop close under the rim -->
<rect x="22" y="22" width="116" height="116" rx="26" fill="#03181e" fill-opacity=".62" filter="url(#glow)"/>
<rect x="28.5" y="31.5" width="103" height="103" rx="19.5" fill="#052830" fill-opacity=".42"/>
<!-- the rim: a dark line around a band of gilt -->
<rect x="28.5" y="26.5" width="103" height="103" rx="19.5" fill="#5e3305"/>
<rect x="30" y="28" width="100" height="100" rx="18" fill="url(#gilt)"/>
<!-- the face: white light along its top, a darker lip along its foot, cream between them, a thin brown line around -->
<g clip-path="url(#in-face)">
<rect x="33" y="31" width="94" height="94" fill="#fff"/>
<rect x="33" y="34.5" width="94" height="94" rx="15" fill="#e3cc9c"/>
<g clip-path="url(#under-the-top-light)"><rect x="33" y="28" width="94" height="94" rx="15" fill="url(#face)"/></g>
<rect x="33" y="31" width="94" height="94" rx="15" fill="none" stroke="#8a5512" stroke-opacity=".6" stroke-width="2.4"/>
</g>
</g>
</svg>
