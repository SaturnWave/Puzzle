<!-- A gold coin with a drop of paint struck on it: the mark of the player's coins, on the wallet, on a price and on
     what a level pays. As the design canvas draws it (HomeTR): its symbol i-coin with the paints it uses, written
     by tools/unity/extract-design-symbols.js. Change the canvas and run that again; do not change this file by
     hand. One unit is one point where the symbol is drawn 100 points wide; the game draws it at the size a place
     needs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
<defs>
