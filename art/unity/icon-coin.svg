<radialGradient id="f-coin" cx=".34" cy=".26" r=".9"><stop offset="0" stop-color="#FFF6CC"/><stop offset=".4" stop-color="#FFD660"/><stop offset="1" stop-color="#EDA428"/></radialGradient>
</defs>
<ellipse cx="50" cy="93" rx="34" ry="5.5" fill="url(#g-shadow)"/>
<circle cx="50" cy="54" r="40" fill="#9C5C0B" stroke="#5E3305" stroke-opacity=".6" stroke-width="1.4"/>
<circle cx="50" cy="47" r="40" fill="url(#f-coin)" stroke="#5E3305" stroke-opacity=".55" stroke-width="1.4"/>
