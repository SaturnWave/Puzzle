<!-- The moves medallion, as the web test page draws its .medallion: a gilt ring turned on the lathe around a cream
     dial. One unit is one point of the design; the ring is 98 across with its middle at (66, 54). The ring's
     gradient runs around the circle, which SVG has no paint for, so that one part is a styled box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="528" height="544" viewBox="0 0 132 136">
<defs>
<radialGradient id="dial" gradientUnits="userSpaceOnUse" cx="53.8" cy="33.1" r="85.1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fbf0d6"/><stop offset="1" stop-color="#ead5a6"/></radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="in-dial"><circle cx="66" cy="54" r="43.5"/></clipPath>
<clipPath id="under-the-top-light"><circle cx="66" cy="58" r="43.5"/></clipPath>
</defs>
<!-- the drop on the wall, then the dark line around the ring -->
<circle cx="66" cy="65" r="49" fill="#042028" fill-opacity=".32" filter="url(#soft)"/>
<circle cx="66" cy="59" r="50.5" fill="#052830" fill-opacity=".42"/>
<circle cx="66" cy="54" r="50.5" fill="#5e3305"/>
<foreignObject x="17" y="5" width="98" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="width:98px;height:98px;border-radius:50%;background:conic-gradient(from 215deg,#fff4c4,#f6b93c 12%,#d38d1a 28%,#ffdb6e 45%,#fff4c4 55%,#e9a52a 72%,#d38d1a 86%,#fff4c4)"></div></foreignObject>
<!-- the dial: white light along its top, a darker lip along its foot, cream between them, a thin brown line around -->
<g clip-path="url(#in-dial)">
<rect x="22" y="10" width="88" height="88" fill="#fff"/>
<circle cx="66" cy="58" r="43.5" fill="#e0c894"/>
<g clip-path="url(#under-the-top-light)"><circle cx="66" cy="50" r="43.5" fill="url(#dial)"/></g>
<circle cx="66" cy="54" r="43.5" fill="none" stroke="#8a5512" stroke-opacity=".65" stroke-width="2.8"/>
</g>
</svg>
