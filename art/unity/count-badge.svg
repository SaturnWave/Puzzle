<!-- The teal badge with what is left of a goal, at the foot of the goal's piece in a card's alcove, as the web test
     page draws its .goal-count. One unit is one point of the design. The badge is 38 x 30 at (5, 4); the game
     stretches the middle of the picture sideways for a longer number, so nothing between x = 21 and x = 27 may
     change along x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="528" height="440" viewBox="0 0 48 40">
<defs>
<linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="34"><stop offset="0" stop-color="#fff4c4"/><stop offset="1" stop-color="#f6b93c"/></linearGradient>
<linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="32"><stop offset="0" stop-color="#1a7f87"/><stop offset="1" stop-color="#0e5660"/></linearGradient>
</defs>
<!-- the drop under the badge, the dark line around it, the gilt rim, the teal face -->
<rect x="3.7" y="5.2" width="40.6" height="32.6" rx="16.3" fill="#281206" fill-opacity=".4"/>
<rect x="3.7" y="2.7" width="40.6" height="32.6" rx="16.3" fill="#4b2a0f"/>
<rect x="5" y="4" width="38" height="30" rx="15" fill="url(#rim)"/>
<rect x="7" y="6" width="34" height="26" rx="13" fill="url(#teal)"/>
</svg>
