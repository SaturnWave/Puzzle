<!-- The round cream disc a booster's picture stands on, in a gilt ring, as the design canvas draws it on the board's
     shelf (BoardTR; the same disc is 66 across before a level and 44 in the shop). One unit is one point of the
     design. The disc is 60 across around (36, 35); with its rings it is 67.6 across. -->
<svg xmlns="http://www.w3.org/2000/svg" width="576" height="576" viewBox="0 0 72 72">
<defs>
<!-- the canvas' light "at 36% 26%" of the disc's own box, out to the box's farthest corner -->
<radialGradient id="cream" gradientUnits="userSpaceOnUse" cx="27.6" cy="20.6" r="58.7"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FAEFD5"/><stop offset="1" stop-color="#E2CC9C"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="in-face"><circle cx="36" cy="35" r="30"/></clipPath>
</defs>
<!-- the drop under the disc, the dark line around it, the gilt ring, the face -->
<circle cx="36" cy="38" r="33.8" fill="#281206" fill-opacity=".35"/>
<circle cx="36" cy="35" r="33.8" fill="#4B2A0F"/>
<circle cx="36" cy="35" r="32.4" fill="#F6B93C"/>
<circle cx="36" cy="35" r="30" fill="url(#cream)"/>
<!-- a white lip along the foot (the face less the face moved up), and over it the soft shade the ring throws in from the top -->
<g clip-path="url(#in-face)">
<path fill="#fff" fill-rule="evenodd" d="M0 0H72V72H0Z M6 33A30 30 0 0 1 66 33A30 30 0 0 1 6 33Z"/>
<path fill="#5C3810" fill-opacity=".4" fill-rule="evenodd" filter="url(#soft)" d="M-16 -16H88V88H-16Z M6 38A30 30 0 0 1 66 38A30 30 0 0 1 6 38Z"/>
</g>
</svg>
