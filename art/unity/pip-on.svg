<!-- A progress pip of a piece that is in its place: gilt, as the design canvas draws it (JigsawTR). One unit is one
     point of the design. The pip is 13 x 9 at (3.5, 3); the game draws it narrower where a painting has many pieces. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 20 15">
<defs><linearGradient id="gilt" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="12"><stop offset="0" stop-color="#FFF4C4"/><stop offset="1" stop-color="#F6B93C"/></linearGradient></defs>
<rect x="2.5" y="3.5" width="15" height="11" rx="4" fill="#031E24" fill-opacity=".5"/>
<rect x="2.5" y="2" width="15" height="11" rx="4" fill="#5E3305"/>
<rect x="3.5" y="3" width="13" height="9" rx="3" fill="url(#gilt)"/>
<path d="M6 4H14" stroke="#fff" stroke-opacity=".75" stroke-width="1" stroke-linecap="round"/>
</svg>
