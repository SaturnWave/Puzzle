<!-- The gilt frame of the picture on a painting's card of the world map (MapWorldTR): 92 points square with corners of 5 and a padding of 3.5, a dark line of 1.3 and a soft drop, open where the picture is drawn under it (85 x 85 at (11.5, 9.5)). The frame lies at (8, 6) in its box. -->
<svg xmlns="http://www.w3.org/2000/svg" width="648" height="660" viewBox="0 0 108 110">
<defs><linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C4"/><stop offset=".22" stop-color="#FFDB6E"/><stop offset=".58" stop-color="#F6B93C"/><stop offset="1" stop-color="#D38D1A"/></linearGradient><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter><mask id="hole"><rect x="0" y="0" width="108" height="110" fill="#fff"/><rect x="11.5" y="9.5" width="85" height="85" rx="2.5" fill="#000"/></mask></defs>
<g mask="url(#hole)"><rect x="8" y="9" width="92" height="92" rx="5" fill="#042028" fill-opacity=".3" filter="url(#soft)"/><rect x="6.7" y="4.7" width="94.6" height="94.6" rx="6.3" fill="#5E3305"/><rect x="8" y="6" width="92" height="92" rx="5" fill="url(#gilt)"/></g><rect x="11.5" y="9.5" width="85" height="85" rx="2.5" fill="none" stroke="#5E3305" stroke-opacity=".55" stroke-width="2"/>
</svg>
