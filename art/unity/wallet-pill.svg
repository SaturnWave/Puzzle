<!-- The cream pill an amount stands in, 36 points high in a gilt rim: the cream plaque's own face, edge and drop at a
     pill's size, as the design canvas draws it for the coins and the lives over every page of the museum (HomeTR)
     and for the coins a won level pays (WinTR). plaque.svg cannot be drawn this low. One unit is one point of the
     design. The pill is 68 x 36 at (14, 5); the game stretches the middle of the picture sideways to the width an
     amount needs, so nothing between x = 34 and x = 62 may change along x. Its drops are a dark that is neither
     warm nor cold: the canvas tints a drop with its ground, and this pill lies on the teal wall and on a cream card
     alike. -->
<svg xmlns="http://www.w3.org/2000/svg" width="576" height="408" viewBox="0 0 96 68">
<defs>
<linearGradient id="gilt" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="41"><stop offset="0" stop-color="#FFF4C4"/><stop offset=".22" stop-color="#FFDB6E"/><stop offset=".58" stop-color="#F6B93C"/><stop offset="1" stop-color="#D38D1A"/></linearGradient>
<linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="38"><stop offset="0" stop-color="#FFFDF4"/><stop offset=".55" stop-color="#FBF0D6"/><stop offset="1" stop-color="#F0DFBB"/></linearGradient>
<filter id="soft" x="-40%" y="-60%" width="180%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="in-face"><rect x="17" y="8" width="62" height="30" rx="15"/></clipPath>
</defs>
<!-- the drops: a soft shadow far below, a hard one close under the rim -->
<rect x="14" y="16" width="68" height="36" rx="18" fill="#14100A" fill-opacity=".3" filter="url(#soft)"/>
<rect x="12.5" y="8.5" width="71" height="39" rx="19.5" fill="#14100A" fill-opacity=".36"/>
<!-- the rim: a dark line around a band of gilt -->
<rect x="12.5" y="3.5" width="71" height="39" rx="19.5" fill="#5E3305"/>
<rect x="14" y="5" width="68" height="36" rx="18" fill="url(#gilt)"/>
<!-- the face: cream, a darker lip along its foot, white light along its top, a thin brown line around -->
<rect x="17" y="8" width="62" height="30" rx="15" fill="url(#face)"/>
<g clip-path="url(#in-face)">
<path fill="#E3CC9C" fill-rule="evenodd" d="M0 0H96V68H0Z M32 5H64A15 15 0 0 1 79 20A15 15 0 0 1 64 35H32A15 15 0 0 1 17 20A15 15 0 0 1 32 5Z"/>
<path fill="#fff" fill-rule="evenodd" d="M0 0H96V68H0Z M32 11.5H64A15 15 0 0 1 79 26.5A15 15 0 0 1 64 41.5H32A15 15 0 0 1 17 26.5A15 15 0 0 1 32 11.5Z"/>
<rect x="17.6" y="8.6" width="60.8" height="28.8" rx="14.4" fill="none" stroke="#8A5512" stroke-opacity=".6" stroke-width="1.2"/>
</g>
</svg>
