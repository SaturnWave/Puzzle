<!-- The green badge in a white ring, as the design canvas draws it on a booster's disc: at the lower right with a
     plus where the player owns none (BoardTR), at the upper right with a tick where the booster is chosen
     (LevelStartTR). The plus is lettering and the tick a picture of its own (glyph-tick.svg). One unit is one point
     of the design. The badge is 22 x 22 at (5, 4); the middle of the picture may be stretched sideways as
     badge-teal.svg's is, so nothing between x = 15 and x = 17 may change along x. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="544" viewBox="0 0 32 34">
<defs><linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="26"><stop offset="0" stop-color="#8BE25A"/><stop offset=".55" stop-color="#4DBE36"/><stop offset="1" stop-color="#2C9A2E"/></linearGradient></defs>
<!-- the drop under the badge, the dark line around it, the white ring, the face -->
<rect x="2" y="4" width="28" height="28" rx="14" fill="#052830" fill-opacity=".35"/>
<rect x="1.8" y=".8" width="28.4" height="28.4" rx="14.2" fill="#145A1B"/>
<rect x="3" y="2" width="26" height="26" rx="13" fill="#fff"/>
<rect x="5" y="4" width="22" height="22" rx="11" fill="url(#green)"/>
</svg>
