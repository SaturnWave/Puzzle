<!-- The round teal button with nothing on it: a teal disc in a gilt ring on a dark lip, as the design canvas draws it
     under the gear (HomeTR), the cross that closes a card (LevelStartTR, SettingsTR), the arrow back (JigsawTR) and,
     two points larger, the pause bars (BoardTR). The mark is a picture of its own. One unit is one point of the
     design. The disc is 44 across around (32, 30); button-back.svg is this disc with its arrow drawn in. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
<defs>
<linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="52"><stop offset="0" stop-color="#3AB0B3"/><stop offset=".5" stop-color="#1D8890"/><stop offset="1" stop-color="#136871"/></linearGradient>
<clipPath id="in-face"><circle cx="32" cy="30" r="22"/></clipPath>
</defs>
<!-- the lip the button is pressed down onto, the dark line, the gilt ring, the face -->
<circle cx="32" cy="34" r="26" fill="#052830" fill-opacity=".4"/>
<circle cx="32" cy="30" r="26" fill="#5E3305"/>
<circle cx="32" cy="30" r="24.6" fill="#F6B93C"/>
<circle cx="32" cy="30" r="22" fill="url(#teal)"/>
<!-- light along the top of the face, a darker foot -->
<g clip-path="url(#in-face)">
<path fill="#fff" fill-opacity=".5" fill-rule="evenodd" d="M0 0H64V64H0Z M10 32.5A22 22 0 0 1 54 32.5A22 22 0 0 1 10 32.5Z"/>
<path fill="#06323A" fill-opacity=".6" fill-rule="evenodd" d="M0 0H64V64H0Z M10 27A22 22 0 0 1 54 27A22 22 0 0 1 10 27Z"/>
</g>
</svg>
