<circle cx="24" cy="26.5" r="19.5" fill="#5C3810" fill-opacity=".35"/><circle cx="24" cy="24" r="18.5" fill="#5E3305"/><circle cx="24" cy="24" r="17" fill="url(#m)"/>
</svg>
